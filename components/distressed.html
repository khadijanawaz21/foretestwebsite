<!-- ═══════════════════════════════════════════ DISTRESSED DEALS WIDGET -->
<style>
/* ── Collapsed Tab ── */
.dd-tab {
  position: fixed;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  z-index: 9998;
  cursor: pointer;
  background: var(--gold);
  border-radius: 6px 0 0 6px;
  padding: 14px 10px;
  display: flex;
  align-items: center;
  gap: 0;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  box-shadow: -2px 0 20px rgba(201,169,110,0.25), -1px 0 6px rgba(201,169,110,0.15);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
  border: none;
  outline: none;
}
.dd-tab:hover {
  transform: translateY(-50%) translateX(-3px);
  box-shadow: -4px 0 28px rgba(201,169,110,0.35), -2px 0 10px rgba(201,169,110,0.2);
}
.dd-tab:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 2px;
}
.dd-tab:active {
  transform: translateY(-50%) translateX(-1px);
}
.dd-tab-text {
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #0A0A0A;
  line-height: 1;
}
.dd-tab-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #E53935;
  margin-bottom: 8px;
  flex-shrink: 0;
  animation: ddPulse 2s ease-in-out infinite;
}
@keyframes ddPulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(229,57,53,0.5); }
  50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(229,57,53,0); }
}
.dd-tab.dd-hidden {
  transform: translateY(-50%) translateX(100%);
  opacity: 0;
  pointer-events: none;
}

/* ── Panel Overlay ── */
.dd-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,0.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
.dd-overlay.dd-open {
  opacity: 1;
  pointer-events: auto;
}

/* ── Expanded Panel ── */
.dd-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 400px;
  max-width: 92vw;
  height: 100vh;
  height: 100dvh;
  z-index: 10000;
  background: var(--bg-dark);
  border-left: 2px solid var(--gold);
  box-shadow: -8px 0 40px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
}
.dd-panel.dd-open {
  transform: translateX(0);
}

/* ── Panel Header ── */
.dd-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 24px 20px;
  border-bottom: 1px solid var(--subtle-border);
  flex-shrink: 0;
}
.dd-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 400;
  color: var(--white);
  letter-spacing: -0.01em;
}
.dd-title em {
  color: var(--gold);
  font-style: italic;
}
.dd-close {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--subtle-border);
  background: transparent;
  color: var(--white-50);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}
.dd-close:hover {
  background: var(--bg-dark3);
  color: var(--white);
  border-color: var(--white-20);
}
.dd-close:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
.dd-close:active {
  transform: scale(0.95);
}

/* ── Scrollable Body ── */
.dd-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  scrollbar-width: thin;
  scrollbar-color: var(--gold-dark) transparent;
}
.dd-body::-webkit-scrollbar { width: 4px; }
.dd-body::-webkit-scrollbar-track { background: transparent; }
.dd-body::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 4px; }

/* ── Empty State ── */
.dd-empty {
  text-align: center;
  padding: 60px 24px;
}
.dd-empty-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto 20px;
  border-radius: 50%;
  border: 1px solid var(--gold-border);
  display: flex;
  align-items: center;
  justify-content: center;
}
.dd-empty-text {
  font-size: 14px;
  color: var(--white-50);
  line-height: 1.7;
}

/* ── Deal Card ── */
.dd-card {
  background: var(--bg-dark2);
  border: 1px solid var(--subtle-border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 16px;
  transition: border-color 0.25s ease, transform 0.2s ease;
}
.dd-card:hover {
  border-color: var(--gold-border);
  transform: translateY(-1px);
}
.dd-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 6px;
}
.dd-card-name {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 400;
  color: var(--white);
  line-height: 1.3;
}
.dd-card-badge {
  flex-shrink: 0;
  background: rgba(229,57,53,0.15);
  color: #F44336;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.dd-card-location {
  font-size: 12px;
  color: var(--white-35);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.dd-card-location svg {
  flex-shrink: 0;
}
.dd-card-prices {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 14px;
}
.dd-card-original {
  font-size: 13px;
  color: var(--white-35);
  text-decoration: line-through;
}
.dd-card-price {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: -0.02em;
}
.dd-card-reason {
  display: inline-block;
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 4px 10px;
  border-radius: 4px;
  background: rgba(201,169,110,0.1);
  color: var(--gold-light);
  border: 1px solid var(--gold-border);
  margin-bottom: 16px;
}
.dd-card-btn {
  display: block;
  width: 100%;
  text-align: center;
  padding: 10px 0;
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-decoration: none;
  color: #0A0A0A;
  background: var(--gold);
  border-radius: 4px;
  transition: background 0.25s ease, transform 0.15s ease;
}
.dd-card-btn:hover {
  background: var(--gold-light);
  transform: translateY(-1px);
}
.dd-card-btn:focus-visible {
  outline: 2px solid var(--white);
  outline-offset: 2px;
}
.dd-card-btn:active {
  transform: translateY(0);
}

/* ── Mobile ── */
@media (max-width: 480px) {
  .dd-tab { padding: 10px 8px; }
  .dd-tab-text { font-size: 10px; }
  .dd-card-price { font-size: 19px; }
  .dd-card-name { font-size: 16px; }
}
</style>

<!-- Tab (collapsed) -->
<button class="dd-tab" id="ddTab" aria-label="Open Distressed Deals">
  <span class="dd-tab-dot"></span>
  <span class="dd-tab-text">Distressed Deals</span>
</button>

<!-- Overlay -->
<div class="dd-overlay" id="ddOverlay"></div>

<!-- Panel (expanded) -->
<div class="dd-panel" id="ddPanel" role="dialog" aria-modal="true" aria-label="Distressed Deals">
  <div class="dd-header">
    <div class="dd-title">Distressed <em>Deals</em></div>
    <button class="dd-close" id="ddClose" aria-label="Close">&times;</button>
  </div>
  <div class="dd-body" id="ddBody">
    <!-- Populated by JS -->
  </div>
</div>

<script>
(function() {
  var tab = document.getElementById('ddTab');
  var panel = document.getElementById('ddPanel');
  var overlay = document.getElementById('ddOverlay');
  var closeBtn = document.getElementById('ddClose');
  var body = document.getElementById('ddBody');

  function openPanel() {
    tab.classList.add('dd-hidden');
    panel.classList.add('dd-open');
    overlay.classList.add('dd-open');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }
  function closePanel() {
    panel.classList.remove('dd-open');
    overlay.classList.remove('dd-open');
    document.body.style.overflow = '';
    setTimeout(function() { tab.classList.remove('dd-hidden'); }, 400);
    tab.focus();
  }

  tab.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  overlay.addEventListener('click', closePanel);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && panel.classList.contains('dd-open')) closePanel();
  });

  function formatPrice(n) {
    if (n >= 1000000) return 'AED ' + (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + 'M';
    return 'AED ' + n.toLocaleString();
  }

  function renderEmpty() {
    body.innerHTML =
      '<div class="dd-empty">' +
        '<div class="dd-empty-icon">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="' + 'var(--gold)' + '" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 15s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>' +
        '</div>' +
        '<p class="dd-empty-text">No active deals right now —<br>check back soon.</p>' +
      '</div>';
  }

  function renderDeals(deals) {
    body.innerHTML = deals.map(function(d) {
      var pct = Math.round(((d.original_price - d.price) / d.original_price) * 100);
      return (
        '<div class="dd-card">' +
          '<div class="dd-card-top">' +
            '<div class="dd-card-name">' + d.name + '</div>' +
            '<div class="dd-card-badge">-' + pct + '%</div>' +
          '</div>' +
          '<div class="dd-card-location">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
            d.location +
          '</div>' +
          '<div class="dd-card-prices">' +
            '<span class="dd-card-original">' + formatPrice(d.original_price) + '</span>' +
            '<span class="dd-card-price">' + formatPrice(d.price) + '</span>' +
          '</div>' +
          '<div class="dd-card-reason">' + (d.reason || 'Quick Sale') + '</div>' +
          '<a href="property-detail.html?id=' + d.id + '" class="dd-card-btn">View Deal</a>' +
        '</div>'
      );
    }).join('');
  }

  fetch('data/distressed.json')
    .then(function(r) { return r.json(); })
    .then(function(deals) {
      if (!deals || !deals.length) return renderEmpty();
      renderDeals(deals);
    })
    .catch(function() { renderEmpty(); });
})();
</script>
