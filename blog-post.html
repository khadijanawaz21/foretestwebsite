<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="IRVV0Zu1oJqf6kIZfefGa_KiP-2qhx0yCLaLgXNuL04" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — FORE</title>
  <meta name="description" content="" />

  <link rel="icon" type="image/png" href="brand_assets/favicon.png" />
  <link rel="apple-touch-icon" href="brand_assets/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" crossorigin />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="mobile.css" />

  <style>
    /* ─── POST HERO ─── */
    .post-hero {
      position: relative;
      height: 62vh;
      min-height: 480px;
      background: var(--bg-dark2);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }
    .post-hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
    }
    .post-hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.55) 40%, rgba(10,10,10,0.15) 100%),
        linear-gradient(to right, rgba(10,10,10,0.4) 0%, transparent 60%);
    }
    .post-hero-content {
      position: relative;
      z-index: 2;
      padding: 0 10% 64px;
      max-width: 860px;
      width: 100%;
    }
    .post-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--white-35);
    }
    .post-breadcrumb a {
      color: var(--white-35);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .post-breadcrumb a:hover { color: var(--gold); }
    .post-breadcrumb-sep { color: var(--white-20); }
    .post-cat-badge {
      display: inline-block;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(10,10,10,0.78);
      border: 0.5px solid var(--gold-border);
      padding: 5px 12px;
      border-radius: 1px;
      margin-bottom: 16px;
    }
    .post-hero-title {
      font-family: var(--font-display);
      font-size: clamp(30px, 4.5vw, 60px);
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 20px;
      max-width: 760px;
    }
    .post-hero-meta {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .post-hero-date,
    .post-hero-readtime {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--white-35);
    }
    .post-hero-meta-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--white-20);
      flex-shrink: 0;
    }

    /* ─── POST LAYOUT ─── */
    .post-layout {
      padding: 72px 10%;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 64px;
      align-items: start;
      background: var(--bg);
    }

    /* ─── ARTICLE BODY ─── */
    .post-article .post-p {
      font-size: 13.5px;
      font-weight: 300;
      color: rgba(255,255,255,0.72);
      line-height: 1.85;
      margin-bottom: 28px;
    }
    .post-article .post-h2 {
      font-family: var(--font-display);
      font-size: clamp(22px, 2.5vw, 32px);
      font-weight: 400;
      color: var(--white);
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin: 48px 0 18px;
      padding-top: 16px;
      border-top: 0.5px solid var(--subtle-border);
    }
    .post-article .post-callout {
      margin: 40px 0;
      padding: 28px 32px;
      border-left: 2px solid var(--gold);
      background: rgba(201,169,110,0.045);
      border-radius: 0 3px 3px 0;
    }
    .post-article .post-callout p {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 300;
      font-style: italic;
      color: var(--gold-light);
      line-height: 1.65;
      margin: 0;
    }

    /* ─── SIDEBAR ─── */
    .post-sidebar {
      position: sticky;
      top: 96px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .sidebar-cta-card {
      background: var(--bg-dark2);
      border: 0.5px solid var(--gold-border);
      border-radius: 3px;
      padding: 32px 28px;
    }
    .sidebar-cta-eyebrow {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    .sidebar-cta-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 400;
      color: var(--white);
      line-height: 1.2;
      margin-bottom: 14px;
    }
    .sidebar-cta-body {
      font-size: 12px;
      color: var(--white-50);
      line-height: 1.8;
      margin-bottom: 24px;
    }
    .sidebar-divider {
      height: 0.5px;
      background: var(--subtle-border);
      margin: 20px 0;
    }
    .sidebar-contact-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }
    .sidebar-contact-label {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--white-35);
      margin-bottom: 2px;
    }
    .sidebar-contact-value {
      font-size: 11.5px;
      color: var(--white-70);
    }
    .sidebar-contact-value a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .sidebar-contact-value a:hover { color: var(--gold); }
    .sidebar-note {
      font-size: 10px;
      color: var(--white-35);
      letter-spacing: 0.5px;
    }

    /* Sidebar categories card */
    .sidebar-cats-card {
      background: var(--bg-dark2);
      border: 0.5px solid var(--subtle-border);
      border-radius: 3px;
      padding: 24px 28px;
    }
    .sidebar-cats-heading {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--white-35);
      margin-bottom: 16px;
    }
    .sidebar-cat-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--subtle-border);
      text-decoration: none;
      font-size: 11.5px;
      color: var(--white-50);
      transition: color 0.2s ease;
    }
    .sidebar-cat-link:last-child { border-bottom: none; }
    .sidebar-cat-link:hover { color: var(--gold); }
    .sidebar-cat-count {
      font-size: 9px;
      color: var(--white-35);
    }

    /* ─── MORE ARTICLES ─── */
    .more-articles {
      padding: 64px 10% 96px;
      background: var(--bg-dark);
      border-top: 0.5px solid var(--gold-border);
    }
    .more-articles-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 40px;
    }
    .more-articles-title {
      font-family: var(--font-display);
      font-size: clamp(28px, 3.2vw, 46px);
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .more-articles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* ─── SHARED CARD (also used in more articles) ─── */
    .blc {
      display: flex;
      flex-direction: column;
      background: var(--bg-dark3);
      border: 0.5px solid var(--subtle-border);
      border-radius: 3px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .blc:hover {
      transform: translateY(-5px);
      border-color: rgba(201,169,110,0.3);
    }
    .blc-img {
      width: 100%;
      aspect-ratio: 16/10;
      background: var(--bg-dark2);
      position: relative;
      overflow: hidden;
    }
    .blc-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.6;
      transition: transform 0.55s ease, opacity 0.3s ease;
    }
    .blc:hover .blc-img img {
      transform: scale(1.05);
      opacity: 0.72;
    }
    .blc-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 55%);
      pointer-events: none;
    }
    .blc-cat {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(10,10,10,0.82);
      border: 0.5px solid var(--gold-border);
      padding: 4px 10px;
      border-radius: 1px;
      z-index: 1;
    }
    .blc-body {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .blc-date {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--white-35);
      margin-bottom: 10px;
    }
    .blc-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 400;
      color: var(--white);
      line-height: 1.25;
      margin-bottom: 10px;
    }
    .blc-excerpt {
      font-size: 12px;
      color: var(--white-50);
      line-height: 1.8;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .blc-read-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      padding-top: 16px;
      border-top: 0.5px solid var(--subtle-border);
      transition: gap 0.2s ease, color 0.2s ease;
    }
    .blc:hover .blc-read-more {
      gap: 10px;
      color: var(--gold-light);
    }

    /* ─── ERROR / LOADING ─── */
    .post-loading {
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--white-35);
      letter-spacing: 1px;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 1100px) {
      .post-layout {
        grid-template-columns: 1fr;
        gap: 48px;
      }
      .post-sidebar {
        position: static;
      }
    }
    @media (max-width: 1024px) {
      .more-articles-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .post-hero-content { padding: 0 6% 48px; }
      .post-layout { padding: 48px 6%; }
      .more-articles { padding: 48px 6% 80px; }
      .more-articles-grid { grid-template-columns: 1fr; }
      .more-articles-header { flex-direction: column; align-items: flex-start; gap: 16px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div data-component="nav"></div>

  <!-- ═══════════════════════════════════════════ POST HERO -->
  <div class="post-hero" id="postHero">
    <div class="post-hero-overlay"></div>
    <div class="post-hero-content" id="postHeroContent">
      <div class="post-loading">Loading article&hellip;</div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════ POST LAYOUT -->
  <div class="post-layout" id="postLayout" style="display:none;">
    <article class="post-article" id="postArticle"></article>
    <aside class="post-sidebar" id="postSidebar"></aside>
  </div>

  <!-- ═══════════════════════════════════════════ MORE ARTICLES -->
  <div class="more-articles" id="moreArticles" style="display:none;"></div>

  <div data-component="footer"></div>
  <div data-component="whatsapp"></div>

  <script src="js/components.js" defer></script>
  <script src="js/mobile.js" defer></script>
  <script>
    // ── Supabase config ──
    const SUPABASE_URL = 'https://famknekdbtrmxopywgsj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhbWtuZWtkYnRybXhvcHl3Z3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NjMxOTksImV4cCI6MjA4OTAzOTE5OX0.HCmQ_4cyuImr3S1wQ-V6oW2G2U4a1rzMUlLPqHC-OeA';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('fore:ready', initPost);
    document.addEventListener('DOMContentLoaded', () => setTimeout(() => {
      if (!window.__postInited) initPost();
    }, 2000));

    function formatDate(str) {
      const d = new Date(str);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderMoreCard(post, i) {
      const img = post.cover_image || 'https://placehold.co/600x375/1C1C1C/555?text=No+Cover';
      return `
        <a href="blog-post.html?slug=${encodeURIComponent(post.slug)}"
           class="blc"
           style="opacity:0;transform:translateY(20px);animation:cardReveal 0.55s ease forwards;animation-delay:${i * 0.1}s">
          <div class="blc-img">
            <img src="${escapeHtml(img)}" alt="${escapeHtml(post.title)}" loading="lazy" />
            <span class="blc-cat">${escapeHtml(post.category || '')}</span>
          </div>
          <div class="blc-body">
            <div class="blc-date">${formatDate(post.created_at)}</div>
            <div class="blc-title">${escapeHtml(post.title)}</div>
            <p class="blc-excerpt">${escapeHtml(post.excerpt || '')}</p>
            <span class="blc-read-more">Read Article &#8594;</span>
          </div>
        </a>
      `;
    }

    async function initPost() {
      if (window.__postInited) return;
      window.__postInited = true;

      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      if (!slug) {
        showNotFound();
        return;
      }

      try {
        // Fetch current post
        const { data: post, error } = await db
          .from('blog_posts')
          .select('*')
          .eq('slug', slug)
          .eq('published', true)
          .single();

        if (error || !post) {
          showNotFound();
          return;
        }

        // Page metadata
        document.title = post.title + ' \u2014 FORE';
        document.querySelector('meta[name="description"]').setAttribute('content', post.excerpt || '');

        // Hero image
        const heroEl = document.getElementById('postHero');
        if (post.cover_image) {
          const img = document.createElement('img');
          img.className = 'post-hero-img';
          img.src = post.cover_image;
          img.alt = post.title;
          heroEl.insertBefore(img, heroEl.firstChild);
        }

        const readTime = post.read_time || Math.max(1, Math.ceil((post.body || '').split(/\s+/).length / 200)) + ' min read';

        document.getElementById('postHeroContent').innerHTML = `
          <nav class="post-breadcrumb" aria-label="breadcrumb">
            <a href="index.html">Home</a>
            <span class="post-breadcrumb-sep">/</span>
            <a href="blog.html">Blog</a>
            <span class="post-breadcrumb-sep">/</span>
            <span style="color:var(--white-50);">${escapeHtml(post.category || '')}</span>
          </nav>
          <span class="post-cat-badge">${escapeHtml(post.category || '')}</span>
          <h1 class="post-hero-title">${escapeHtml(post.title)}</h1>
          <div class="post-hero-meta">
            <span class="post-hero-date">${formatDate(post.created_at)}</span>
            <span class="post-hero-meta-dot"></span>
            <span class="post-hero-readtime">${escapeHtml(readTime)}</span>
          </div>
        `;

        // Article body — render markdown to HTML
        const articleEl = document.getElementById('postArticle');
        if (post.body) {
          // Use marked.js to parse markdown
          const htmlContent = marked.parse(post.body);
          articleEl.innerHTML = htmlContent;
          // Apply post styling classes to rendered elements
          articleEl.querySelectorAll('p').forEach(p => p.classList.add('post-p'));
          articleEl.querySelectorAll('h2').forEach(h => h.classList.add('post-h2'));
          articleEl.querySelectorAll('blockquote').forEach(bq => bq.classList.add('post-callout'));
        } else {
          articleEl.innerHTML = '<p class="post-p" style="color:var(--white-35);">This article has no content yet.</p>';
        }

        // Sidebar — fetch all posts for category counts
        const { data: allPosts } = await db
          .from('blog_posts')
          .select('id, title, slug, category, excerpt, cover_image, created_at')
          .eq('published', true)
          .order('created_at', { ascending: false });

        const posts = allPosts || [];
        const uniqueCats = [...new Set(posts.map(p => p.category).filter(Boolean))];

        document.getElementById('postSidebar').innerHTML = `
          <div class="sidebar-cta-card">
            <div class="sidebar-cta-eyebrow">Free Consultation</div>
            <h3 class="sidebar-cta-title">Ready to invest in Dubai?</h3>
            <p class="sidebar-cta-body">
              Book a free 30-minute call with one of our investment advisors. We'll match your goals and budget to the right properties and strategy.
            </p>
            <a href="index.html#contact" class="btn-primary" style="display:block;text-align:center;">Book a Free Call</a>
            <div class="sidebar-divider"></div>
            <div class="sidebar-contact-list">
              <div>
                <div class="sidebar-contact-label">Email</div>
                <div class="sidebar-contact-value">
                  <a href="mailto:info@fairopportunityrealestate.com">info@fairopportunityrealestate.com</a>
                </div>
              </div>
              <div>
                <div class="sidebar-contact-label">WhatsApp</div>
                <div class="sidebar-contact-value">+971 54 244 5867</div>
              </div>
              <div>
                <div class="sidebar-contact-label">Based in</div>
                <div class="sidebar-contact-value">Office 3602, Burj Al Salam Tower, Trade Center, Dubai, UAE</div>
              </div>
            </div>
            <p class="sidebar-note">No commitment. No pressure. Just answers.</p>
          </div>
          <div class="sidebar-cats-card">
            <div class="sidebar-cats-heading">Browse by Category</div>
            <div>
              ${uniqueCats.map(cat => `
                <a href="blog.html?cat=${encodeURIComponent(cat)}" class="sidebar-cat-link">
                  ${escapeHtml(cat)}
                  <span class="sidebar-cat-count">${posts.filter(p => p.category === cat).length}</span>
                </a>
              `).join('')}
            </div>
          </div>
        `;

        document.getElementById('postLayout').style.display = '';

        // Related posts — same category, limit 3
        const related = posts.filter(p => p.slug !== slug && p.category === post.category).slice(0, 3);
        const others = related.length > 0 ? related : posts.filter(p => p.slug !== slug).slice(0, 3);

        if (others.length > 0) {
          const moreEl = document.getElementById('moreArticles');
          moreEl.style.display = '';
          moreEl.innerHTML = `
            <div class="more-articles-header">
              <div>
                <div class="section-tag">More From the Blog</div>
                <h2 class="more-articles-title">
                  More <em class="gold">articles</em> for you
                </h2>
              </div>
              <a href="blog.html" class="btn-ghost">View All Articles &#8594;</a>
            </div>
            <div class="more-articles-grid">
              ${others.map(renderMoreCard).join('')}
            </div>
          `;
        }

      } catch (err) {
        console.error('Post load error:', err);
        showNotFound();
      }
    }

    function showNotFound() {
      document.title = 'Article Not Found \u2014 FORE';
      document.getElementById('postHeroContent').innerHTML = `
        <div class="section-tag">Not Found</div>
        <h1 style="font-family:var(--font-display);font-size:clamp(32px,4vw,54px);font-weight:300;margin-bottom:20px;line-height:1.1;">Article not found.</h1>
        <p style="font-size:12px;color:var(--white-50);margin-bottom:32px;">The article you're looking for doesn't exist or may have moved.</p>
        <a href="blog.html" class="btn-primary">&#8592; Back to Blog</a>
      `;
    }
  </script>
  <script src="js/particle-wave.js"></script>

</body>
</html>
