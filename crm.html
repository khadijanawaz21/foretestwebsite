<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORE — CRM</title>
  <link rel="icon" type="image/png" href="brand_assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A96E;
      --gold-light: #E2C99A;
      --gold-dark: #9A7A48;
      --gold-border: rgba(201,169,110,0.22);
      --subtle-border: rgba(255,255,255,0.06);
      --bg: #0A0A0A;
      --bg-dark: #111111;
      --bg-dark2: #161616;
      --bg-dark3: #1C1C1C;
      --white: #FFFFFF;
      --white-70: rgba(255,255,255,0.7);
      --white-50: rgba(255,255,255,0.5);
      --white-35: rgba(255,255,255,0.35);
      --white-20: rgba(255,255,255,0.2);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-ui: 'Montserrat', sans-serif;
      --success: #7FB88A;
      --error: #E17B6B;
      --warning: #D9A85C;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-ui);
      font-weight: 300;
      font-size: 13px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .dash-header {
      background: var(--bg-dark);
      border-bottom: 0.5px solid var(--gold-border);
      padding: 0 32px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dash-logo { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--gold); letter-spacing: 4px; }
    .dash-header-right { display: flex; align-items: center; gap: 20px; }
    .dash-role { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--white-50); }
    .logout-btn {
      background: transparent; border: 0.5px solid var(--white-20); color: var(--white-70);
      font-family: var(--font-ui); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 8px 16px; border-radius: 2px; cursor: pointer; transition: border-color 0.3s ease, color 0.3s ease;
    }
    .logout-btn:hover { border-color: var(--gold-border); color: var(--gold); }
    .logout-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    main { max-width: 1240px; margin: 0 auto; padding: 32px; }

    .state-message { color: var(--white-50); padding: 60px 0; text-align: center; font-size: 13px; }

    .stats-row { display: flex; gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--bg-dark2); border: 0.5px solid var(--subtle-border); border-radius: 3px;
      padding: 18px 24px; flex: 1;
      box-shadow: 0 8px 24px -12px rgba(0,0,0,0.6);
    }
    .stat-num { font-family: var(--font-display); font-size: 30px; font-weight: 600; color: var(--gold); }
    .stat-label { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--white-50); margin-top: 4px; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filters select {
      background: var(--bg-dark2); border: 0.5px solid var(--subtle-border); color: var(--white-70);
      font-family: var(--font-ui); font-size: 11px; padding: 8px 10px; border-radius: 2px; outline: none;
    }
    .filters select:focus-visible { border-color: var(--gold-border); }

    .leads-table { width: 100%; border-collapse: collapse; background: var(--bg-dark2); border: 0.5px solid var(--subtle-border); border-radius: 3px; overflow: hidden; }
    .leads-table th, .leads-table td { padding: 12px 14px; border-bottom: 0.5px solid var(--subtle-border); text-align: left; font-size: 12px; vertical-align: top; }
    .leads-table th { background: var(--bg-dark3); color: var(--white-50); font-weight: 500; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .leads-table tbody tr:hover { background: rgba(255,255,255,0.02); }
    .message-cell { max-width: 220px; color: var(--white-70); }
    .empty-state { text-align: center; color: var(--white-35); padding: 40px !important; }
    .muted { color: var(--white-50); }
    .small { font-size: 11px; }

    .badge { padding: 3px 9px; border-radius: 999px; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; border: 0.5px solid var(--subtle-border); color: var(--white-70); background: var(--bg-dark3); }
    .badge-bayut { color: #E1A88A; border-color: rgba(225,168,138,0.3); }
    .badge-propertyfinder { color: #8AB4E1; border-color: rgba(138,180,225,0.3); }

    .pill { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; border: 0.5px solid transparent; }
    .pill-new { background: rgba(217,168,92,0.14); color: var(--warning); }
    .pill-assigned { background: rgba(138,180,225,0.14); color: #8AB4E1; }
    .pill-contacted { background: rgba(201,169,110,0.14); color: var(--gold); }
    .pill-qualified { background: rgba(127,184,138,0.14); color: var(--success); }
    .pill-won { background: rgba(127,184,138,0.22); color: var(--success); }
    .pill-lost { background: rgba(255,255,255,0.06); color: var(--white-50); }
    .pill-closed { background: rgba(255,255,255,0.06); color: var(--white-50); }

    .row-form { display: flex; gap: 6px; }
    .row-form select {
      background: var(--bg); border: 0.5px solid var(--subtle-border); color: var(--white-70);
      font-family: var(--font-ui); font-size: 11px; padding: 6px 8px; border-radius: 2px; outline: none;
    }
    .row-form button {
      background: var(--gold); color: var(--bg); border: none; border-radius: 2px;
      font-family: var(--font-ui); font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
      padding: 6px 12px; cursor: pointer; transition: background 0.3s ease;
    }
    .row-form button:hover { background: var(--gold-light); }
    .row-form button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .property-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 0.5px solid var(--gold-border);
      color: var(--gold);
      background: rgba(201,169,110,0.08);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-decoration: none;
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .property-link:hover { background: rgba(201,169,110,0.16); border-color: var(--gold); }
    .property-link:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="dash-header">
    <div class="dash-logo">FORE CRM</div>
    <div class="dash-header-right">
      <span class="dash-role" id="roleLabel"></span>
      <button class="logout-btn" id="logoutBtn">Sign Out</button>
    </div>
  </div>

  <main id="main">
    <div class="state-message">Loading…</div>
  </main>

  <script>
    const SUPABASE_URL = 'https://famknekdbtrmxopywgsj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhbWtuZWtkYnRybXhvcHl3Z3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NjMxOTksImV4cCI6MjA4OTAzOTE5OX0.HCmQ_4cyuImr3S1wQ-V6oW2G2U4a1rzMUlLPqHC-OeA';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const main = document.getElementById('main');
    const roleLabel = document.getElementById('roleLabel');
    const SOURCE_LABELS = {
      homepage: 'Homepage', contact: 'Contact', 'golden-visa': 'Golden Visa',
      academy: 'Academy', 'property-enquiry': 'Property Enquiry',
      bayut: 'Bayut', propertyfinder: 'Property Finder',
    };
    const STATUSES = ['new', 'assigned', 'contacted', 'qualified', 'won', 'lost', 'closed'];

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.replace('/crm-login.html');
    });

    function escapeHtml(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // "View Listing ↗" — only when the lead actually has a FORE listing
    // URL. Uses lead.property_url verbatim (already returned by
    // /api/crm/list-leads and /api/crm/agent-leads) — never reconstructed
    // from property_id, which is a loose text snapshot with no guarantee
    // of still resolving to a live listing. Opens in a new tab so working
    // a lead never navigates the agent away from the CRM.
    function propertyLinkHtml(lead) {
      const url = (lead.property_url || '').trim();
      if (!url) return '';
      return `<a class="property-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">View Listing ↗</a>`;
    }

    async function authedFetch(url) {
      const { data } = await supabase.auth.getSession();
      if (!data.session) { window.location.replace('/crm-login.html'); throw new Error('no session'); }
      return fetch(url, { headers: { Authorization: `Bearer ${data.session.access_token}` } });
    }

    async function authedPost(url, body) {
      const { data } = await supabase.auth.getSession();
      if (!data.session) { window.location.replace('/crm-login.html'); throw new Error('no session'); }
      return fetch(url, {
        method: 'POST',
        headers: { Authorization: `Bearer ${data.session.access_token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    }

    // ── Admin view ──────────────────────────────────────────────────
    async function renderAdmin() {
      const [agentsRes, leadsRes] = await Promise.all([
        authedFetch('/api/crm/list-agents'),
        authedFetch('/api/crm/list-leads'),
      ]);
      const { agents } = await agentsRes.json();
      const { leads } = await leadsRes.json();
      renderAdminUI(agents, leads, {});
    }

    function renderAdminUI(agents, leads, filters) {
      const counts = {
        total: leads.length,
        new: leads.filter((l) => l.status === 'new').length,
        unassigned: leads.filter((l) => !l.agent_id).length,
      };

      main.innerHTML = `
        <div class="stats-row">
          <div class="stat-card"><div class="stat-num">${counts.total}</div><div class="stat-label">Total leads</div></div>
          <div class="stat-card"><div class="stat-num">${counts.new}</div><div class="stat-label">New</div></div>
          <div class="stat-card"><div class="stat-num">${counts.unassigned}</div><div class="stat-label">Unassigned</div></div>
        </div>
        <div class="toolbar">
          <div class="filters">
            <select id="filterSource">
              <option value="">All sources</option>
              ${Object.entries(SOURCE_LABELS).map(([v, l]) => `<option value="${v}" ${filters.source === v ? 'selected' : ''}>${l}</option>`).join('')}
            </select>
            <select id="filterStatus">
              <option value="">All statuses</option>
              ${STATUSES.map((s) => `<option value="${s}" ${filters.status === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
            <select id="filterAgent">
              <option value="">All agents</option>
              <option value="unassigned" ${filters.agent === 'unassigned' ? 'selected' : ''}>Unassigned</option>
              ${agents.map((a) => `<option value="${a.id}" ${filters.agent === a.id ? 'selected' : ''}>${escapeHtml(a.name)}</option>`).join('')}
            </select>
          </div>
        </div>
        <table class="leads-table">
          <thead>
            <tr>
              <th>Source</th><th>Contact</th><th>Property</th><th>Message</th>
              <th>Status</th><th>Assigned to</th><th>Received</th><th>Assign</th>
            </tr>
          </thead>
          <tbody id="leadsBody"></tbody>
        </table>
      `;

      const body = document.getElementById('leadsBody');
      if (leads.length === 0) {
        body.innerHTML = `<tr><td colspan="8" class="empty-state">No leads match these filters.</td></tr>`;
      } else {
        body.innerHTML = leads.map((lead) => `
          <tr>
            <td><span class="badge badge-${lead.source}">${SOURCE_LABELS[lead.source] || lead.source}</span></td>
            <td>
              <div><strong>${escapeHtml(lead.full_name)}</strong></div>
              <div class="muted small">${escapeHtml(lead.phone || '')}</div>
              <div class="muted small">${escapeHtml(lead.email || '')}</div>
            </td>
            <td>
              <div>${escapeHtml(lead.property_title || '—')}</div>
              ${propertyLinkHtml(lead)}
            </td>
            <td class="message-cell">${escapeHtml(lead.message || '—')}</td>
            <td><span class="pill pill-${lead.status}">${lead.status}</span></td>
            <td>${escapeHtml((lead.agents && lead.agents.name) || '—')}</td>
            <td class="muted small">${new Date(lead.created_at).toLocaleString()}</td>
            <td>
              <form class="row-form" data-lead-id="${lead.id}">
                <select name="agent_id" required>
                  <option value="">Assign to…</option>
                  ${agents.map((a) => `<option value="${a.id}" ${lead.agent_id === a.id ? 'selected' : ''}>${escapeHtml(a.name)}</option>`).join('')}
                </select>
                <button type="submit">Go</button>
              </form>
            </td>
          </tr>
        `).join('');

        body.querySelectorAll('form.row-form').forEach((form) => {
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const leadId = form.getAttribute('data-lead-id');
            const agentId = form.querySelector('select[name="agent_id"]').value;
            if (!agentId) return;
            const btn = form.querySelector('button');
            btn.disabled = true;
            btn.textContent = '…';
            const res = await authedPost('/api/crm/assign-lead', { leadId, agentId });
            if (!res.ok) {
              alert('Failed to assign lead.');
              btn.disabled = false;
              btn.textContent = 'Go';
              return;
            }
            renderAdmin();
          });
        });
      }

      function applyFilters() {
        const params = new URLSearchParams();
        const source = document.getElementById('filterSource').value;
        const status = document.getElementById('filterStatus').value;
        const agent = document.getElementById('filterAgent').value;
        if (source) params.set('source', source);
        if (status) params.set('status', status);
        if (agent) params.set('agent', agent);
        authedFetch(`/api/crm/list-leads?${params.toString()}`).then(async (r) => {
          const { leads: filtered } = await r.json();
          renderAdminUI(agents, filtered, { source, status, agent });
        });
      }
      document.getElementById('filterSource').addEventListener('change', applyFilters);
      document.getElementById('filterStatus').addEventListener('change', applyFilters);
      document.getElementById('filterAgent').addEventListener('change', applyFilters);
    }

    // ── Agent view ──────────────────────────────────────────────────
    async function renderAgent() {
      const res = await authedFetch('/api/crm/agent-leads');
      const { leads } = await res.json();
      renderAgentUI(leads);
    }

    function renderAgentUI(leads) {
      main.innerHTML = `
        <h2 style="font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--gold);margin-bottom:20px;">My Leads</h2>
        <table class="leads-table">
          <thead>
            <tr><th>Source</th><th>Contact</th><th>Property</th><th>Message</th><th>Status</th><th>Received</th><th>Update</th></tr>
          </thead>
          <tbody id="leadsBody"></tbody>
        </table>
      `;

      const body = document.getElementById('leadsBody');
      if (leads.length === 0) {
        body.innerHTML = `<tr><td colspan="7" class="empty-state">No leads assigned to you yet.</td></tr>`;
        return;
      }

      body.innerHTML = leads.map((lead) => `
        <tr>
          <td><span class="badge badge-${lead.source}">${SOURCE_LABELS[lead.source] || lead.source}</span></td>
          <td>
            <div><strong>${escapeHtml(lead.full_name)}</strong></div>
            <div class="muted small">${escapeHtml(lead.phone || '')}</div>
            <div class="muted small">${escapeHtml(lead.email || '')}</div>
          </td>
          <td>
            <div>${escapeHtml(lead.property_title || '—')}</div>
            ${propertyLinkHtml(lead)}
          </td>
          <td class="message-cell">${escapeHtml(lead.message || '—')}</td>
          <td><span class="pill pill-${lead.status}">${lead.status}</span></td>
          <td class="muted small">${new Date(lead.created_at).toLocaleString()}</td>
          <td>
            <form class="row-form" data-lead-id="${lead.id}">
              <select name="status">
                ${STATUSES.filter((s) => s !== 'new').map((s) => `<option value="${s}" ${lead.status === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
              <button type="submit">Update</button>
            </form>
          </td>
        </tr>
      `).join('');

      body.querySelectorAll('form.row-form').forEach((form) => {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const leadId = form.getAttribute('data-lead-id');
          const status = form.querySelector('select[name="status"]').value;
          const btn = form.querySelector('button');
          btn.disabled = true;
          btn.textContent = '…';
          const res = await authedPost('/api/crm/update-lead-status', { leadId, status });
          if (!res.ok) {
            alert('Failed to update status.');
            btn.disabled = false;
            btn.textContent = 'Update';
            return;
          }
          renderAgent();
        });
      });
    }

    // ── Boot ────────────────────────────────────────────────────────
    async function boot() {
      const { data } = await supabase.auth.getSession();
      if (!data.session) { window.location.replace('/crm-login.html'); return; }

      const whoamiRes = await authedFetch('/api/crm/whoami');
      if (!whoamiRes.ok) { window.location.replace('/crm-login.html'); return; }
      const { role, agent } = await whoamiRes.json();

      if (role === 'admin') {
        roleLabel.textContent = 'Admin';
        renderAdmin();
      } else if (role === 'agent') {
        roleLabel.textContent = agent ? agent.name : 'Agent';
        renderAgent();
      } else {
        roleLabel.textContent = '';
        main.innerHTML = `<div class="state-message">Your account doesn't have CRM access yet. Contact an admin to get set up.</div>`;
      }
    }

    boot();
  </script>
</body>
</html>
