<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORE — Set Up CRM Access</title>
  <link rel="icon" type="image/png" href="brand_assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A96E;
      --gold-light: #E2C99A;
      --gold-dark: #9A7A48;
      --gold-border: rgba(201,169,110,0.22);
      --subtle-border: rgba(255,255,255,0.06);
      --bg: #0A0A0A;
      --bg-dark2: #161616;
      --white: #FFFFFF;
      --white-35: rgba(255,255,255,0.35);
      --white-50: rgba(255,255,255,0.5);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-ui: 'Montserrat', sans-serif;
      --error: #F44336;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-ui);
      font-weight: 300;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--bg-dark2);
      border: 0.5px solid var(--gold-border);
      border-radius: 3px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .logo { font-family: var(--font-display); font-size: 32px; font-weight: 600; color: var(--gold); letter-spacing: 4px; margin-bottom: 8px; }
    .subtitle { font-size: 9px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: var(--white-35); margin-bottom: 24px; }
    .intro { font-size: 12px; color: var(--white-50); line-height: 1.7; margin-bottom: 28px; }

    form { display: flex; flex-direction: column; gap: 14px; }

    .input {
      width: 100%;
      background: var(--bg);
      border: 0.5px solid var(--subtle-border);
      border-radius: 2px;
      color: var(--white);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 300;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.3s ease;
    }
    .input:focus { border-color: var(--gold-border); }
    .input::placeholder { color: var(--white-35); }

    .btn {
      width: 100%;
      margin-top: 4px;
      background: var(--gold);
      color: var(--bg);
      font-family: var(--font-ui);
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: none;
      border-radius: 2px;
      padding: 14px 30px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn:hover { background: var(--gold-light); }
    .btn:active { background: var(--gold-dark); }
    .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .error { color: var(--error); font-size: 11px; margin-top: 4px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">FORE</div>
    <div class="subtitle">Internal CRM</div>
    <div id="content"></div>
  </div>

  <script>
    // Same public anon key already used throughout this site — not a
    // secret. detectSessionInUrl (the client default) reads the
    // access_token this invite link's redirect carries in the URL
    // fragment and establishes a session from it automatically, before
    // any of this script runs.
    const SUPABASE_URL = 'https://famknekdbtrmxopywgsj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhbWtuZWtkYnRybXhvcHl3Z3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NjMxOTksImV4cCI6MjA4OTAzOTE5OX0.HCmQ_4cyuImr3S1wQ-V6oW2G2U4a1rzMUlLPqHC-OeA';

    const content = document.getElementById('content');

    function renderExpiredState() {
      content.innerHTML = `
        <p class="intro">This link is invalid or has expired. Ask your admin to send you a new invite.</p>
      `;
    }

    // Distinct from renderExpiredState: this is for real failures (client
    // failed to load, getSession() errored) rather than "no session
    // present" — same visual treatment, different message, so a stuck
    // page always shows *something* instead of leaving the static shell
    // (logo + subtitle) as the only thing that ever renders.
    function renderErrorState(message) {
      content.innerHTML = `
        <p class="intro">${message}</p>
      `;
    }

    let supabase;
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      console.error('Supabase init failed:', err);
      renderErrorState('Something went wrong loading this page. Please refresh and try again.');
    }

    function renderForm() {
      content.innerHTML = `
        <p class="intro">Set a password for your FORE CRM account.</p>
        <form id="setPasswordForm">
          <input type="password" id="password" class="input" placeholder="New password" autocomplete="new-password" minlength="8" required />
          <input type="password" id="confirmPassword" class="input" placeholder="Confirm password" autocomplete="new-password" minlength="8" required />
          <button type="submit" id="submitBtn" class="btn">Set Password &amp; Sign In</button>
          <div id="formError" class="error"></div>
        </form>
      `;

      const form = document.getElementById('setPasswordForm');
      const btn = document.getElementById('submitBtn');
      const errorEl = document.getElementById('formError');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.style.display = 'none';

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
          errorEl.textContent = "Passwords don't match.";
          errorEl.style.display = 'block';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Saving…';

        const { error } = await supabase.auth.updateUser({ password });

        if (error) {
          errorEl.textContent = error.message || 'Something went wrong. Try again.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Set Password & Sign In';
          return;
        }

        window.location.replace('/crm.html');
      });
    }

    async function boot() {
      // If init already failed above, supabase is undefined and an error
      // state is already showing — nothing to do here.
      if (!supabase) return;

      try {
        // The client processes the URL fragment synchronously during
        // createClient() above, but getSession() is still the reliable way
        // to confirm a session actually landed before showing the form.
        const { data, error } = await supabase.auth.getSession();

        if (error) {
          console.error('getSession() failed:', error);
          renderErrorState('Something went wrong verifying your link. Please refresh and try again.');
          return;
        }

        if (data.session) {
          renderForm();
        } else {
          renderExpiredState();
        }
      } catch (err) {
        console.error('boot() failed:', err);
        renderErrorState('Something went wrong verifying your link. Please refresh and try again.');
      }
    }

    boot();
  </script>
</body>
</html>
