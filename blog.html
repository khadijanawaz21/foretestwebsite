<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="IRVV0Zu1oJqf6kIZfefGa_KiP-2qhx0yCLaLgXNuL04" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guides &amp; Updates | FORE</title>
  <meta name="description" content="Investor insights, market updates, and property guides for Dubai real estate. Researched and written by the FORE team." />

  <link rel="icon" href="brand_assets/favicon.ico" />
  <link rel="apple-touch-icon" href="brand_assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" crossorigin />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="mobile.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ─── PAGE HEADER ─── */
    .blog-page-header {
      padding: 160px 10% 72px;
      background: var(--bg-dark);
      border-bottom: 0.5px solid var(--gold-border);
      position: relative;
      overflow: hidden;
    }
    .blog-page-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 75% 40%, rgba(201,169,110,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 15% 85%, rgba(201,169,110,0.04) 0%, transparent 50%);
      pointer-events: none;
    }
    /* Grain texture */
    .blog-page-header::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .blog-page-header-inner {
      position: relative;
      z-index: 1;
      max-width: 720px;
    }
    .blog-page-title {
      font-family: var(--font-display);
      font-size: clamp(44px, 6vw, 80px);
      font-weight: 300;
      line-height: 1.04;
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 20px;
    }
    .blog-page-sub {
      font-size: 13px;
      color: var(--white-50);
      line-height: 1.8;
      max-width: 500px;
      margin-bottom: 40px;
    }

    /* ─── FILTER PILLS ─── */
    .blog-filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .blog-filter-pill {
      font-family: var(--font-ui);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--white-35);
      background: transparent;
      border: 0.5px solid rgba(255,255,255,0.12);
      border-radius: 2px;
      padding: 8px 18px;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      outline: none;
    }
    .blog-filter-pill:hover {
      color: var(--white-70);
      border-color: rgba(255,255,255,0.28);
    }
    .blog-filter-pill:focus-visible {
      box-shadow: 0 0 0 2px var(--gold-border);
    }
    .blog-filter-pill.active {
      color: var(--bg);
      background: var(--gold);
      border-color: var(--gold);
    }
    .blog-filter-pill.active:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
    }

    /* ─── LISTING SECTION ─── */
    .blog-listing-section {
      padding: 64px 10% 96px;
      background: var(--bg);
      min-height: 480px;
    }
    .blog-full-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* ─── BLOG CARD ─── */
    .blc {
      display: flex;
      flex-direction: column;
      background: var(--bg-dark3);
      border: 0.5px solid var(--subtle-border);
      border-radius: 3px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .blc:hover {
      transform: translateY(-5px);
      border-color: rgba(201,169,110,0.3);
    }
    .blc-img {
      width: 100%;
      aspect-ratio: 16/10;
      background: var(--bg-dark2);
      position: relative;
      overflow: hidden;
    }
    .blc-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.6;
      transition: transform 0.55s ease, opacity 0.3s ease;
    }
    .blc:hover .blc-img img {
      transform: scale(1.05);
      opacity: 0.72;
    }
    .blc-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.68) 0%, transparent 55%);
      pointer-events: none;
    }
    .blc-cat {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(10,10,10,0.82);
      border: 0.5px solid var(--gold-border);
      padding: 4px 10px;
      border-radius: 1px;
      z-index: 1;
    }
    .blc-body {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .blc-date {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--white-35);
      margin-bottom: 10px;
    }
    .blc-title {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 400;
      color: var(--white);
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .blc-excerpt {
      font-size: 12px;
      color: var(--white-50);
      line-height: 1.8;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .blc-read-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      padding-top: 16px;
      border-top: 0.5px solid var(--subtle-border);
      transition: gap 0.2s ease, color 0.2s ease;
    }
    .blc:hover .blc-read-more {
      gap: 10px;
      color: var(--gold-light);
    }

    /* ─── EMPTY / LOADING STATES ─── */
    .blog-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 40px;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--white-35);
    }

    /* ─── SKELETON / SHIMMER LOADING ─── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton-card {
      display: flex;
      flex-direction: column;
      background: var(--bg-dark3);
      border: 0.5px solid var(--subtle-border);
      border-radius: 3px;
      overflow: hidden;
    }
    .skeleton-img {
      width: 100%;
      aspect-ratio: 16/10;
      background: var(--bg-dark2);
    }
    .skeleton-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .skeleton-line {
      height: 12px;
      border-radius: 2px;
      background: linear-gradient(
        90deg,
        var(--bg-dark2) 0%,
        rgba(255,255,255,0.04) 40%,
        rgba(255,255,255,0.06) 50%,
        rgba(255,255,255,0.04) 60%,
        var(--bg-dark2) 100%
      );
      background-size: 800px 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }
    .skeleton-line--date {
      width: 35%;
      height: 8px;
    }
    .skeleton-line--title {
      width: 85%;
      height: 16px;
      margin-top: 2px;
    }
    .skeleton-line--title-short {
      width: 55%;
      height: 16px;
    }
    .skeleton-line--text {
      width: 100%;
      height: 10px;
    }
    .skeleton-line--text-med {
      width: 80%;
      height: 10px;
    }
    .skeleton-line--text-short {
      width: 60%;
      height: 10px;
    }
    .skeleton-line--cta {
      width: 30%;
      height: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 0.5px solid var(--subtle-border);
    }
    /* Stagger the shimmer across cards */
    .skeleton-card:nth-child(2) .skeleton-line { animation-delay: 0.15s; }
    .skeleton-card:nth-child(3) .skeleton-line { animation-delay: 0.3s; }
    .skeleton-card:nth-child(4) .skeleton-line { animation-delay: 0.45s; }
    .skeleton-card:nth-child(5) .skeleton-line { animation-delay: 0.6s; }
    .skeleton-card:nth-child(6) .skeleton-line { animation-delay: 0.75s; }

    /* ─── LOAD-FAIL FALLBACK ─── */
    .blog-fallback {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 40px;
    }
    .blog-fallback p {
      font-size: 13px;
      color: var(--white-35);
      letter-spacing: 0.5px;
      line-height: 1.8;
      margin-bottom: 24px;
    }
    .blog-fallback a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      transition: color 0.2s ease, gap 0.2s ease;
    }
    .blog-fallback a:hover {
      color: var(--gold-light);
      gap: 10px;
    }
    .blog-fallback a:focus-visible {
      outline: 2px solid var(--gold-border);
      outline-offset: 4px;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 1024px) {
      .blog-full-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .blog-page-header { padding: 120px 6% 56px; }
      .blog-listing-section { padding: 48px 6% 80px; }
      .blog-full-grid { grid-template-columns: 1fr; }
      .blog-filter-bar { gap: 6px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div data-component="nav"></div>

  <!-- ═══════════════════════════════════════════ PAGE HEADER -->
  <div class="blog-page-header">
    <div class="blog-page-header-inner">
      <div class="section-tag">Guides &amp; Updates</div>
      <h1 class="blog-page-title">
        Guides &amp; <em class="gold">Updates</em>
      </h1>
      <p class="blog-page-sub">
        What you need to know before buying property in Dubai.
      </p>
      <div class="blog-filter-bar" id="blogFilters">
        <!-- Injected by JS after posts load -->
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════ BLOG LISTING -->
  <section class="blog-listing-section">
    <div class="blog-full-grid" id="blogGrid">
      <!-- Skeleton loading cards (replaced once fore:ready fires) -->
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-img skeleton-line"></div><div class="skeleton-body"><div class="skeleton-line skeleton-line--date"></div><div class="skeleton-line skeleton-line--title"></div><div class="skeleton-line skeleton-line--title-short"></div><div class="skeleton-line skeleton-line--text"></div><div class="skeleton-line skeleton-line--text-med"></div><div class="skeleton-line skeleton-line--text-short"></div><div class="skeleton-line skeleton-line--cta"></div></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-img skeleton-line"></div><div class="skeleton-body"><div class="skeleton-line skeleton-line--date"></div><div class="skeleton-line skeleton-line--title"></div><div class="skeleton-line skeleton-line--title-short"></div><div class="skeleton-line skeleton-line--text"></div><div class="skeleton-line skeleton-line--text-med"></div><div class="skeleton-line skeleton-line--text-short"></div><div class="skeleton-line skeleton-line--cta"></div></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-img skeleton-line"></div><div class="skeleton-body"><div class="skeleton-line skeleton-line--date"></div><div class="skeleton-line skeleton-line--title"></div><div class="skeleton-line skeleton-line--title-short"></div><div class="skeleton-line skeleton-line--text"></div><div class="skeleton-line skeleton-line--text-med"></div><div class="skeleton-line skeleton-line--text-short"></div><div class="skeleton-line skeleton-line--cta"></div></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-img skeleton-line"></div><div class="skeleton-body"><div class="skeleton-line skeleton-line--date"></div><div class="skeleton-line skeleton-line--title"></div><div class="skeleton-line skeleton-line--title-short"></div><div class="skeleton-line skeleton-line--text"></div><div class="skeleton-line skeleton-line--text-med"></div><div class="skeleton-line skeleton-line--text-short"></div><div class="skeleton-line skeleton-line--cta"></div></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-img skeleton-line"></div><div class="skeleton-body"><div class="skeleton-line skeleton-line--date"></div><div class="skeleton-line skeleton-line--title"></div><div class="skeleton-line skeleton-line--title-short"></div><div class="skeleton-line skeleton-line--text"></div><div class="skeleton-line skeleton-line--text-med"></div><div class="skeleton-line skeleton-line--text-short"></div><div class="skeleton-line skeleton-line--cta"></div></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-img skeleton-line"></div><div class="skeleton-body"><div class="skeleton-line skeleton-line--date"></div><div class="skeleton-line skeleton-line--title"></div><div class="skeleton-line skeleton-line--title-short"></div><div class="skeleton-line skeleton-line--text"></div><div class="skeleton-line skeleton-line--text-med"></div><div class="skeleton-line skeleton-line--text-short"></div><div class="skeleton-line skeleton-line--cta"></div></div></div>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════ CTA BAND -->
  <div class="cta-band fade-in">
    <h2 class="cta-title">
      Ready to buy property in Dubai?<br>
      <em class="gold">Talk to us</em> — it's free.
    </h2>
    <div class="cta-actions">
      <a href="index.html#contact" class="btn-primary">Book a Free Call</a>
      <p class="cta-note">30 minutes. No commitment. No sales pitch.</p>
    </div>
  </div>

  <div data-component="footer"></div>
  <div data-component="whatsapp"></div>

  <script src="js/components.js" defer></script>
  <script src="js/mobile.js" defer></script>
  <script>
    // ── Supabase config ──
    const SUPABASE_URL = 'https://famknekdbtrmxopywgsj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhbWtuZWtkYnRybXhvcHl3Z3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NjMxOTksImV4cCI6MjA4OTAzOTE5OX0.HCmQ_4cyuImr3S1wQ-V6oW2G2U4a1rzMUlLPqHC-OeA';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('fore:ready', initBlog);
    // Also try on DOMContentLoaded in case fore:ready is delayed
    document.addEventListener('DOMContentLoaded', () => setTimeout(() => {
      if (!window.__blogInited) initBlog();
    }, 2000));

    const _skeletonTimeout = setTimeout(function() {
      const grid = document.getElementById('blogGrid');
      if (grid.querySelector('.skeleton-card')) {
        grid.innerHTML =
          '<div class="blog-fallback">' +
            '<p>We couldn\u2019t load the articles right now.</p>' +
            '<a href="https://www.fairopportunityrealestate.com" target="_blank" rel="noopener">' +
              'Visit our main site for the latest articles &#8594;' +
            '</a>' +
          '</div>';
      }
    }, 10000);

    function formatDate(str) {
      const d = new Date(str);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderCard(post, i) {
      const img = post.cover_image || 'https://placehold.co/600x375/1C1C1C/555?text=No+Cover';
      const date = post.created_at || post.date || '';
      return `
        <a href="blog-post.html?slug=${encodeURIComponent(post.slug)}"
           class="blc"
           style="animation: cardReveal 0.55s ease forwards; animation-delay: ${i * 0.07}s; opacity: 0; transform: translateY(20px);">
          <div class="blc-img">
            <img src="${escapeHtml(img)}" alt="${escapeHtml(post.title)}" loading="lazy" />
            <span class="blc-cat">${escapeHtml(post.category || '')}</span>
          </div>
          <div class="blc-body">
            <div class="blc-date">${formatDate(date)}</div>
            <div class="blc-title">${escapeHtml(post.title)}</div>
            <p class="blc-excerpt">${escapeHtml(post.excerpt || '')}</p>
            <span class="blc-read-more">Read Article &#8594;</span>
          </div>
        </a>
      `;
    }

    function renderPosts(posts, activeCat) {
      const filtered = activeCat === 'All' ? posts : posts.filter(p => p.category === activeCat);
      const grid = document.getElementById('blogGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="blog-empty">No articles in this category yet.</div>';
        return;
      }
      grid.innerHTML = filtered.map(renderCard).join('');
    }

    async function initBlog() {
      if (window.__blogInited) return;
      window.__blogInited = true;
      clearTimeout(_skeletonTimeout);

      try {
        const { data: posts, error } = await db
          .from('blog_posts')
          .select('id, title, slug, category, excerpt, cover_image, featured, read_time, author, created_at')
          .eq('published', true)
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!posts || posts.length === 0) {
          document.getElementById('blogGrid').innerHTML = '<div class="blog-empty">No articles published yet. Check back soon.</div>';
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const preselect = params.get('cat') || 'All';

        const categories = ['All', ...new Set(posts.map(p => p.category).filter(Boolean))];
        const filtersEl = document.getElementById('blogFilters');
        filtersEl.innerHTML = categories.map(cat =>
          `<button class="blog-filter-pill${cat === preselect ? ' active' : ''}"
                   data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`
        ).join('');

        filtersEl.querySelectorAll('.blog-filter-pill').forEach(btn => {
          btn.addEventListener('click', () => {
            filtersEl.querySelectorAll('.blog-filter-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPosts(posts, btn.dataset.cat);
          });
        });

        renderPosts(posts, preselect);
      } catch (err) {
        console.error('Blog load error:', err);
        document.getElementById('blogGrid').innerHTML =
          '<div class="blog-fallback"><p>We couldn\u2019t load the articles right now.</p></div>';
      }

      // Fade-in for CTA band
      const observer = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
        });
      }, { threshold: 0.15 });
      document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    }
  </script>
  <script src="js/particle-wave.js"></script>

</body>
</html>
